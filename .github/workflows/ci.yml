name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system PDF libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Audit runtime dependencies
        run: >-
          pip-audit
          --progress-spinner off
          --ignore-vuln PYSEC-2026-2034
          --ignore-vuln PYSEC-2026-3412
          -r requirements.lock
      - name: Compile
        run: python -m compileall -q .
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Validate Compose
        env:
          SECRET_KEY: ci-compose-validation-secret-value-000000
        run: docker compose config --quiet

{% extends "base.html" %}
{% block title %}Reset your password — PDFBillr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="card p-8">
    <h1 class="font-display tracking-tight text-2xl font-semibold mb-2 text-ink">Forgot password?</h1>
    <p class="text-sm text-graphite mb-6">Enter your email and we'll send a reset link.</p>

{% include "partials/flashes.html" %}

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <label for="field-email" class="field-label">Email</label>
        <input id="field-email" type="email" name="email" required autocomplete="email"
               class="input-field" placeholder="you@example.com" />
      </div>
      <button type="submit"
              class="btn-primary w-full h-11">
        Send reset link
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-graphite">
      <a href="{{ url_for('auth.login') }}" class="text-accent hover:underline">Back to sign in</a>
    </p>
  </div>
</div>
{% endblock %}

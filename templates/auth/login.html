{% extends "base.html" %}
{% block title %}Sign in — PDFBillr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="card p-8">
    <h1 class="font-display tracking-tight text-2xl font-semibold mb-6 text-ink">Sign in</h1>

{% include "partials/flashes.html" %}

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <label for="field-email" class="field-label">Email</label>
        <input id="field-email" type="email" name="email" required autocomplete="email"
               class="input-field" placeholder="you@example.com" />
      </div>
      <div>
        <label for="field-password" class="field-label">Password</label>
        <input id="field-password" type="password" name="password" required autocomplete="current-password"
               class="input-field" placeholder="Your password" />
      </div>
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-graphite cursor-pointer">
          <input type="checkbox" name="remember" class="rounded border-rule-strong text-accent" />
          Remember me
        </label>
        <a href="{{ url_for('auth.forgot_password') }}"
           class="text-sm text-accent hover:underline">Forgot password?</a>
      </div>
      <button type="submit"
              class="btn-primary w-full h-11">
        Sign in
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-graphite">
      No account?
      <a href="{{ url_for('auth.register') }}" class="text-accent hover:underline">Create one free</a>
    </p>
  </div>
</div>
{% endblock %}

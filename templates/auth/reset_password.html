{% extends "base.html" %}
{% block title %}Set a new password — PDFBillr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="card p-8">
    <h1 class="font-display tracking-tight text-2xl font-semibold mb-6 text-ink">Set new password</h1>

{% include "partials/flashes.html" %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <label for="field-password" class="field-label">New password</label>
        <input id="field-password" type="password" name="password" required autocomplete="new-password" minlength="8"
               class="input-field" placeholder="At least 8 characters" />
      </div>
      <div>
        <label for="field-confirm-password" class="field-label">Confirm new password</label>
        <input id="field-confirm-password" type="password" name="confirm_password" required autocomplete="new-password"
               class="input-field" placeholder="Repeat password" />
        <span id="pw-match-error" class="text-xs text-overdue hidden mt-1 block">Passwords do not match.</span>
      </div>
      <button type="submit"
              class="btn-primary w-full h-11">
        Update password
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}

{% macro lock(class="w-3.5 h-3.5") -%}
<svg class="{{ class }} shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path stroke-linecap="round" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
{%- endmacro %}

{% macro status_pill(status) -%}
{%- set styles = {'paid': 'pill-paid', 'overdue': 'pill-overdue', 'partial': 'pill-due', 'sent': 'pill-sent', 'finalized': 'pill-sent'} -%}
<span class="{{ styles.get(status, 'pill-draft') }}">{{ status | capitalize }}</span>
{%- endmacro %}
